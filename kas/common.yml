---
header:
  version: 8
  includes:
    - cache.yml

repos:
  meta-trenchboot:

  poky:
    url: https://git.yoctoproject.org/git/poky
    commit: 702c515a7568b10bb208635d1d747b529e810690
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    commit: 52e78803b0c0c2f6b523b6a6fd4505af25cc6ff2
    layers:
      meta-oe:
      meta-networking:
      meta-filesystems:
      meta-python:
      meta-perl:

  meta-security:
    url: https://git.yoctoproject.org/meta-security
    commit: 730ebbddc121016151a72d3e0bce61351a0ad365
    layers:
      meta-tpm:

  meta-dasharo:
    url: https://github.com/Dasharo/meta-dasharo
    commit: 42bcc8afcaf8818622f72dd4b0f4fb91aa2ca40b

bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""
    LICENSE_FLAGS_ACCEPTED = "commercial"
local_conf_header:
  standard: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_rpm"
    SDKMACHINE = "x86_64"
    USER_CLASSES = "buildstats"
    PATCHRESOLVE = "noop"
  debug-tweaks: |
    EXTRA_IMAGE_FEATURES = "debug-tweaks"
  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
