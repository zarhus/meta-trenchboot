---
header:
  version: 14
  includes:
    - cache.yml

repos:
  meta-trenchboot:

  bitbake:
    url: https://git.openembedded.org/bitbake
    commit: 7af7e04f3adc8ba144d9e2e6b37ed4ddb3b59df0
    layers:
      .: disabled

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    commit: 21314665e198c1abe458d0bad5c4d14d4c3ad856
    layers:
      meta:
    patches:
      biosplusefi:
        repo: meta-trenchboot
        path: patches/0001-wic-bootimg_efi.py-use-hdd-as-workdir-instead-of-hdd.patch

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    commit: 691ff0fbeab54eceb26d90140d7a8f672532235b
    layers:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    commit: 6f989b75a08aacdcec1edb761da5559d3443c1ef
    layers:
      meta-initramfs:
      meta-oe:
      meta-networking:
      meta-filesystems:
      meta-python:
      meta-perl:

  meta-security:
    url: https://git.yoctoproject.org/meta-security
    commit: 18c6a7b5d836cc35c5131e33449b786111eceaf5
    layers:
      meta-tpm:

  meta-dasharo:
    url: https://github.com/Dasharo/meta-dasharo
    commit: c01dd496ff03617c97cfbec4fc4190eea85fd3af

bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""
    LICENSE_FLAGS_ACCEPTED = "commercial"
local_conf_header:
  standard: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_rpm"
    SDKMACHINE = "x86_64"
    USER_CLASSES = "buildstats"
    PATCHRESOLVE = "noop"
  debug-tweaks: |
    EXTRA_IMAGE_FEATURES = "allow-empty-password allow-root-login empty-root-password post-install-logging"
  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
